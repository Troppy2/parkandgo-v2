services:
  - type: web
    name: parkandgo-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements/prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: USE_REDIS
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
