name: CI

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create-neon-branch:
    name: Create Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    outputs:
      db_url_with_pooler: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

  backend-tests:
    name: Backend Tests
    needs: [create-neon-branch]
    # always() lets this run even when create-neon-branch is skipped (e.g. workflow_dispatch)
    if: always() && github.event.action != 'closed'
    env:
      # Dummy values so pydantic-settings boots — never used for actual connections
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost/test
      SECRET_KEY: ci-test-secret-key
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run Alembic migrations against preview branch
        if: needs.create-neon-branch.outputs.db_url_with_pooler != ''
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ needs.create-neon-branch.outputs.db_url_with_pooler }}

      - name: Run backend tests
        run: pytest -q

  frontend-tests:
    name: Frontend Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

  delete-neon-branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
